<link rel="stylesheet" href="canon-tables.css">
<style>
  :root {
    --paper: #f3f0e8; --paper-2: #e9e5da; --ink: #141312; --ink-2: #4a4744; --ink-3: #8a857d;
    --rule: #cfcac0; --vellum: #f1e9d6;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; }
  .desk { padding: clamp(28px, 6vw, 88px) 16px clamp(64px, 10vw, 140px); }
  .label {
    margin: 0 auto clamp(18px, 3vw, 34px); text-align: center;
    font: 500 11px/1 'EB Garamond', serif; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3);
  }
  /* a leaf of vellum to set the tables on */
  .leaf {
    position: relative;
    margin: 0 auto;
    width: min(100%, 1180px);
    padding: clamp(28px, 5vw, 72px) clamp(14px, 4.5vw, 72px) clamp(36px, 5vw, 64px);
    background: var(--vellum);
    box-shadow: 0 1px 0 rgba(60, 40, 20, .06), 0 18px 50px -30px rgba(60, 40, 20, .35);
  }
  .leaf + .leaf { margin-top: clamp(40px, 7vw, 96px); }
  .leaf.is-narrow { width: min(100%, 860px); }
  .leaf.is-slim { width: min(100%, 700px); }
  /* a whole folio is its own leaf: it lies on the desk as it is */
  .leaf.is-folio { width: min(100%, 980px); padding: 0; background: none; box-shadow: none; }
  .leaf.is-folio.is-narrow { width: min(100%, 820px); }
  /* the grip on the first leaf resizes it, so the arcade can be seen rebuilding */
  .grip {
    position: absolute; top: 0; bottom: 0; right: -30px; width: 22px; margin: 0;
    /* engine-lint: allow big-touch-none -- a 22px strip, shown only to fine pointers at 900px+ */
    border: 0; padding: 0; background: none; cursor: ew-resize; touch-action: none; display: none; color: var(--ink-3);
  }
  .grip::before {
    content: ""; position: sticky; top: calc(50vh - 36px); display: block; margin: 40px auto; width: 4px; height: 72px; border-radius: 4px;
    background: currentColor; opacity: .45; transition: opacity .25s;
  }
  .grip:hover::before, .grip:focus-visible::before, .grip.is-dragging::before { opacity: .9; }
  .grip:focus-visible { outline: none; }
  .grip:focus-visible::after { content: ""; position: absolute; inset: 30px 0; border-radius: 12px; box-shadow: 0 0 0 1.5px var(--ink-2); }
  @media (hover: hover) and (pointer: fine) and (min-width: 900px) { .grip { display: block; } }
</style>
</head>

<script type="module" src="canon-tables.js"></script>
<script type="module">
  // Demo only: a grip on the first leaf's edge, so the arcade can be seen re-solving.
  const leaf = document.getElementById('leaf');
  const grip = document.getElementById('grip');
  const MIN = 360;
  const max = () => Math.min(1180, document.querySelector('.desk').clientWidth - 32);
  const set = (v) => {
    const w = Math.round(Math.max(MIN, Math.min(max(), v)));
    leaf.style.width = w + 'px';
    grip.setAttribute('aria-valuenow', w);
    grip.setAttribute('aria-valuetext', w + ' pixels');
  };
  let x0 = 0, w0 = 0, id = null;
  grip.addEventListener('pointerdown', (e) => {
    id = e.pointerId; grip.setPointerCapture(id); x0 = e.clientX; w0 = leaf.getBoundingClientRect().width;
    grip.classList.add('is-dragging'); e.preventDefault();
  });
  grip.addEventListener('pointermove', (e) => { if (e.pointerId === id) set(w0 + (e.clientX - x0) * 2); });
  const end = (e) => { if (e.pointerId !== id) return; id = null; grip.classList.remove('is-dragging'); };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('keydown', (e) => {
    const cur = leaf.getBoundingClientRect().width, step = e.shiftKey ? 120 : 30;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') set(cur - step);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') set(cur + step);
    else if (e.key === 'Home') set(MIN);
    else if (e.key === 'End') set(max());
    else return;
    e.preventDefault();
  });
</script>
