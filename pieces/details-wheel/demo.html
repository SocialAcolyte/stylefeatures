<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>details-wheel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="details-wheel.css"><style>
  :root{--paper:#f3f0e8;--ink:#141312;--ink-3:#8a857d;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;overflow-x:hidden}
  .spacer{height:70svh;display:grid;place-items:center;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
</style></head><body>
<div class="spacer">scroll</div>
<section data-details-wheel>
  <div class="dw-stage">
    <div class="dw-word"><h2>God is in the details of your labour</h2></div>
      <figure class="dw-card"><img src="demo-images/caucasus-faberg-egg-detail.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/illuminated-frontispiece-sarlawh-from-the-shahna.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/inhabited-initial-c-google-art-project.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/isfahan-lotfollah-mosque-ceiling-symmetric.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/langobardic-fibula-with-an-enamel-bust-walters-4.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/meister-des-book-of-kells-001.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/napoleonic-faberg-egg-detail.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/north-germany-hildesheim-16th-century-leaf-from.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/pfauenfeder-detail-20230511-rm-163536.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/prague-astronomical-clock-detail-2.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/saint-joseph-church-macon-ga-stained-glass-rose.jpg" alt="" loading="lazy" decoding="async"></figure>
      <figure class="dw-card"><img src="demo-images/tile-panel-met-lc-17-190-2085.jpg" alt="" loading="lazy" decoding="async"></figure>
  </div>
</section>
<div class="spacer">end</div>
<script type="module" src="details-wheel.js"></script>
</body></html>
