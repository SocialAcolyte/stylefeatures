<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>murmuration</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="murmuration.css">
<style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;overflow-x:hidden}
  .tag{margin:0;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

  /* hero: the whole first screen is sky */
  .hero [data-murmuration]{aspect-ratio:auto;height:min(92svh,900px);min-height:520px}
  .hero .copy{position:absolute;left:var(--gutter);right:var(--gutter);bottom:clamp(14px,3.2svh,30px);display:flex;justify-content:space-between;align-items:end;gap:16px;pointer-events:none}
  .hero h1{margin:0;font-weight:300;font-style:italic;font-size:clamp(34px,5.4vw,64px);line-height:.95;letter-spacing:-.01em;color:#efe6d4}
  .hero .tag{color:#b8ab98}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:22px var(--gutter) 0}
  @media (max-width:560px){.controls{padding-right:60px;padding-left:12px}.controls button{padding:11px 14px}}
  .controls button{font:500 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:transparent;
    border:1px solid var(--rule);border-radius:999px;padding:11px 18px;cursor:pointer}
  .controls button:hover{border-color:var(--ink-3);color:var(--ink)}
  .controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .note{max-width:34em;margin:14px auto 0;padding:0 var(--gutter);text-align:center;color:var(--ink-2);font-size:17px;font-style:italic}

  .uses{max-width:1180px;margin:0 auto;padding:clamp(56px,10svh,110px) var(--gutter) 110px;display:grid;gap:clamp(36px,6svh,64px)}
  .pair{display:grid;grid-template-columns:1fr;gap:clamp(28px,3vw,40px);border-top:1px solid var(--rule);padding-top:clamp(24px,5svh,48px)}
  @media (min-width:820px){.pair{grid-template-columns:1.25fr 1fr}}
  figure{margin:0;display:grid;gap:12px}
  .lost{--mm-aspect:4/3;--mm-aspect-narrow:4/5;display:grid;place-items:center;border-radius:2px}
  .lost .msg{text-align:center;transform:translateY(-14%)}
  .lost b{display:block;font-weight:300;font-style:italic;font-size:clamp(64px,11vw,120px);line-height:.9;color:#f2ead8;letter-spacing:-.02em}
  .lost span{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#e7dcc7}
  .lost a{color:inherit;pointer-events:auto}
  .empty{--mm-aspect:1/1;--mm-aspect-narrow:1/1;border-radius:2px}
  .empty .msg{position:absolute;left:0;right:0;top:12%;text-align:center;font-style:italic;font-size:22px;color:#f2ead8}
  figcaption{color:var(--ink-2);font-size:17px}
</style></head><body>
<main>
  <section class="hero" aria-label="Murmuration">
    <div data-murmuration data-birds="4000" id="sky">
      <div class="copy"><h1>Murmuration</h1><span class="tag">Sturnus vulgaris · dusk</span></div>
    </div>
    <div class="controls">
      <button type="button" id="falcon">Send the falcon</button>
      <button type="button" id="roost">Let them roost</button>
    </div>
    <p class="note">Move over the sky: the pointer is a peregrine. On a phone, tap.</p>
  </section>

  <section class="uses">
    <div class="pair">
      <figure>
        <div data-murmuration data-birds="1400" class="lost">
          <div class="msg"><b>404</b><span>This page has flown. <a href="./">Back home</a></span></div>
        </div>
        <figcaption>A 404: the page has gone to roost.</figcaption>
      </figure>
      <figure>
        <div data-murmuration data-birds="700" data-roost="40" class="empty">
          <div class="msg">Nothing here yet.</div>
        </div>
        <figcaption>An empty state: seven hundred birds, and they roost after forty idle seconds.</figcaption>
      </figure>
    </div>
    <span class="tag">murmuration</span>
  </section>
</main>
<script type="module">
  import './murmuration.js';
  const sky = document.getElementById('sky');
  document.getElementById('falcon').addEventListener('click', () => sky.__murmuration.scatter());
  document.getElementById('roost').addEventListener('click', () => sky.__murmuration.roost());
</script>
<script type="module" src="sound.js"></script>
</body></html>
