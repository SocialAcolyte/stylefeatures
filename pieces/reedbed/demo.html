<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>reedbed</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reedbed.css">
<style>
  :root{--paper:#f3f0e8;--paper-2:#e9e5da;--ink:#141312;--ink-2:#4a4744;--ink-3:#8a857d;--rule:#cfcac0;--accent:#c96f4a;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--gutter:clamp(16px,3vw,32px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);overflow-x:hidden}
  .tag{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  .band{width:100%}
  main{max-width:1240px;margin:0 auto;padding:clamp(28px,6svh,64px) var(--gutter) 96px;display:grid;gap:clamp(36px,8svh,96px)}
  .hero{display:grid;gap:clamp(4px,1.5svh,14px);justify-items:center;text-align:center}
  .hero h1{margin:0;font-weight:300;font-style:italic;font-size:clamp(30px,4.6vw,52px);letter-spacing:-.005em;line-height:1;color:var(--ink-2)}
  .hero p{margin:0;max-width:34em;font-size:clamp(17px,1.6vw,20px);line-height:1.45;color:var(--ink-2)}
  .pair{border-top:1px solid var(--rule);padding-top:clamp(24px,5svh,56px);display:grid;gap:14px;justify-items:center}
  .pair [data-reedbed]{--rb-aspect:16/9;--rb-aspect-narrow:4/5;max-width:880px}
  .foot{justify-self:center}
</style></head><body>
<figure class="band" data-reedbed>
  <img src="assets/reedbed-dusk.webp" alt="" aria-hidden="true" width="1680" height="720">
</figure>
<main>
  <section class="hero">
    <span class="tag">Phragmites australis</span>
    <h1>Wind over the reeds</h1>
    <p>Drag across the reeds to blow. Faster is a stronger gust.</p>
  </section>
  <section class="pair" aria-label="A still evening">
    <span class="tag">Still evening</span>
    <figure data-reedbed data-breeze="0.6" data-idle="still" data-seed="9">
      <img src="assets/reedbed-dusk.webp" alt="" aria-hidden="true" width="1680" height="720">
    </figure>
  </section>
  <span class="tag foot">reedbed</span>
</main>
<script type="module" src="reedbed.js"></script>
<script type="module" src="sound.js"></script>
</body></html>
