<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="./backdrop/backdrop.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product name</title>
<meta name="description" content="One line that says what the product does and who it is for.">
<meta property="og:title" content="Product name">
<meta name="theme-color" content="#f5f3ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./film/film.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top">
  <a class="mark" href="#">Product <em>name</em></a>
  <a class="btn solid sm" href="#start">Get started</a>
</nav>

<header class="intro">
  <p class="eyebrow">What it is, in a few words</p>
  <h1>Say what it does, <em>then scroll.</em></h1>
  <p class="hint"><span aria-hidden="true">↓</span> Scroll to play the film</p>
</header>

<!-- The scrubbed film: a code tour whose clock follows the scroll (tours.js: "film"). The section's height sets
     the pace, about one screen per chapter. Each <li> is one of the tour's chapter() steps, in order.
     A recording instead: data-src="media/film.mp4" on the figure and data-at="seconds" on each <li>. -->
<section class="scrub" id="scrub" aria-label="The film, played by scrolling">
  <div class="stage">
    <figure class="frame" data-film="film" data-fit=".88 .84" data-record aria-label="A film of the product, played by scrolling"></figure>
    <ol class="chapters" id="chapters">
      <li><button type="button"><span class="n">01</span><b>Start from nothing</b><span class="line">An empty workspace and one button.</span><i class="fill"></i></button></li>
      <li><button type="button"><span class="n">02</span><b>Make it yours</b><span class="line">Settings beside the work.</span><i class="fill"></i></button></li>
      <li><button type="button"><span class="n">03</span><b>The whole picture</b><span class="line">Everything in one place.</span><i class="fill"></i></button></li>
      <li><button type="button"><span class="n">04</span><b>Share it</b><span class="line">One link for the whole team.</span><i class="fill"></i></button></li>
    </ol>
  </div>
</section>

<section class="end" id="start">
  <h2>An invitation, <em>in six words or so.</em></h2>
  <div class="go"><a class="btn solid" href="#">Get started</a><a class="btn ghost" href="#">Read the docs</a></div>
</section>

<footer><span>Product name</span><span>© Year · Company</span></footer>

<script type="module" src="script.js"></script>
</body>
</html>
